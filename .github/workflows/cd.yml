name: CD

on:
  workflow_run:
    workflows: ["Java CI with Maven and Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          

      - name: Deploy application to remote server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/student-app:latest &&
            docker rm -f student-app || true &&
            docker run -d --name student-app --restart unless-stopped -p 9090:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/student-app:latest
          "

      - name: Verify deployment
        run: |
          curl -fsS http://${{ secrets.DEPLOY_HOST }}:9090/actuator/health || exit 1
